<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <g transform="translate(32 32)">
    <!-- Horizontal orbit — Atoll -->
    <ellipse rx="26" ry="10" fill="none" stroke="#097275" stroke-width="3.5"/>
    <!-- Diagonal orbit 60° — Zest -->
    <ellipse rx="26" ry="10" fill="none" stroke="#E2701B" stroke-width="3.5" transform="rotate(60)"/>
    <!-- Diagonal orbit 120° — Brick -->
    <ellipse rx="26" ry="10" fill="none" stroke="#911B1B" stroke-width="3.5" transform="rotate(120)"/>
    <!-- Nucleus — Atoll -->
    <circle r="5" fill="#097275"/>
  </g>
</svg>
